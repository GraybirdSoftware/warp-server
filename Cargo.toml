[package]
name = "warp-server"
version = "0.1.0"
edition = "2024"



[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "warp-server"


[dependencies]
actix-web = { version = "4.13.0", features = ["experimental-introspection"] }
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.22.0", features = ["v5", "serde", "v4"] }
validator = { version = "0.20.0", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "chrono", "uuid"] }
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["form", "json", "multipart"] }
color-eyre = "0.6.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
warp = { git = "https://github.com/Vector35/warp/", tag = "1.0.1", version = "1.0.1" }
actix-multipart = "0.8.1"
base64 = "0.23.1"
sha2 = "0.11.0"
rand = "0.10.2"
hex = "0.4.3"
thiserror = "2.0.20"
dotenvy = "0.15.7"
serde_qs = "1.1.3"
url = "2.5.8"
futures-util = "0.3.34"
flate2 = "1.1.10"
